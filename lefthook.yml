# Git hooks. Every gate here also runs in CI; running them locally means a bad
# commit never reaches the remote in the first place.
# Managed by lefthook — installed by the `prepare` script on `bun install`.

pre-commit:
  parallel: false
  jobs:
    - name: format and lint staged files
      run: bun run lint-staged

commit-msg:
  jobs:
    - name: conventional commit message
      run: bun commitlint --edit {1}

pre-push:
  parallel: false
  jobs:
    - name: typecheck
      run: bun run typecheck

    - name: unit and component tests
      run: bun run test

    - name: architecture boundaries
      run: bun run arch:layers

    - name: dependency graph
      run: bun run arch:graph

    - name: dead code
      run: bun run deadcode

    - name: dependency vulnerabilities
      run: bun run security:audit
