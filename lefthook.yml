# Git hooks. What runs here is what is cheap enough to run on every commit and
# every push; the test suites run in CI, where `main` will not take a merge
# request whose pipeline has not passed.
#
# The split is deliberate. Formatting, lint, types, architecture, dead code and
# the audit answer in seconds and catch a mistake before it costs a pipeline.
# The unit, component and acceptance suites are minutes, and CI runs them on
# every push regardless — running them locally too bought nothing but the wait.
#
# Managed by lefthook — installed by the `prepare` script on `bun install`.

pre-commit:
  parallel: false
  jobs:
    - name: format and lint staged files
      run: bun run lint-staged

commit-msg:
  jobs:
    - name: conventional commit message
      run: bun commitlint --edit {1}

pre-push:
  parallel: false
  jobs:
    - name: typecheck
      run: bun run typecheck

    - name: architecture boundaries
      run: bun run arch:layers

    - name: dependency graph
      run: bun run arch:graph

    - name: dead code
      run: bun run deadcode

    - name: dependency vulnerabilities
      run: bun run security:audit
