# Records each Netlify deploy of `staging` and `main` as a GitHub deployment, so
# the repository shows what production and homologation are running, since
# when, and at which address.
#
# Netlify reports deploy previews to GitHub and nothing else: it has no
# notification that creates a deployment, and it posts no status for a branch
# deploy or for production. So this asks the site itself. The Netlify build
# writes the commit it built to `/commit.txt` (`netlify.toml`), and the job waits
# until the environment's address serves this push's commit. The `environment`
# key is what makes the job a deployment: GitHub marks it in progress while the
# job runs, and successful or failed with it.
#
# A job that finds a newer commit served has been overtaken by a later push,
# which is a deploy that happened rather than one that failed, so it succeeds;
# the later push's own job marks it inactive. One that finds nothing it knows
# for twenty minutes fails, and the Netlify deploy log says why.

name: Deployments

on:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  netlify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://gitlabdashboard.netlify.app' || 'https://staging--gitlabdashboard.netlify.app' }}
    steps:
      - name: Wait for Netlify to publish this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: ${{ github.ref_name == 'main' && 'https://gitlabdashboard.netlify.app' || 'https://staging--gitlabdashboard.netlify.app' }}
        run: |
          for attempt in $(seq 60); do
            served=$(curl --fail --silent --show-error --header 'Cache-Control: no-cache' "$SITE/commit.txt?attempt=$attempt" || true)
            if [ "$served" = "$GITHUB_SHA" ]; then
              echo "$SITE is serving $GITHUB_SHA."
              exit 0
            fi
            if [[ "$served" =~ ^[0-9a-f]{40}$ ]] && [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$served" --jq .status)" = ahead ]; then
              echo "$SITE is already serving $served, which comes after $GITHUB_SHA."
              exit 0
            fi
            sleep 20
          done
          echo "::error::$SITE did not serve $GITHUB_SHA within twenty minutes. The Netlify deploy log for this commit says why."
          exit 1
