# Every gate that guards the code at a commit, and the release that follows a
# merge into `main`. The checks about a pull request itself — where it comes
# from and what its commits say — are in `pull-request.yml`, and why they are
# there rather than here is written at its top.
#
# Mutation testing reports on a schedule of its own, in `mutation.yml`, so that
# a push here can never cancel it. `CONTRIBUTING.md` describes the flow these
# jobs enforce.
#
# Bun runs everything except the two tools that cannot: Stryker's plugin loader
# and the Playwright run itself, both of which need Node. The Playwright image
# ships Node and the browsers, so `e2e` runs inside it and installs Bun there;
# the rest run on the runner through `.github/actions/setup`.

name: CI

on:
  # `staging` as well as `main`: a promotion's head is the head of `staging`,
  # and GitHub lets a pull request merge on checks its head already carries.
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request makes the run in flight
# worthless, so it is cancelled rather than left to finish. On `main` that
# includes a release in waiting: the run that replaced it releases the same
# commits, and more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Format, lint, ARIA, types, FSD layers, the dependency graph, dead code, type
  # coverage and `bun audit` — the whole fast gate, in one job, because any one
  # of them failing means the same thing: do not merge this.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run verify

  # Coverage thresholds are enforced by the run itself: 90% overall, 100% on the
  # model layer. The four totals are written to the job's summary, which is
  # where GitLab used to show them beside the merge request.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      lines: ${{ steps.summary.outputs.lines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run test:coverage
      - name: Coverage summary
        id: summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          bun -e '
            const { total } = await Bun.file("coverage/coverage-summary.json").json()
            const rows = ["statements", "branches", "functions", "lines"]
              .map((metric) => `| ${metric} | ${total[metric].pct}% |`)
            const table = ["| Coverage | |", "| --- | ---: |", ...rows].join("\n")
            await Bun.write(Bun.env.GITHUB_STEP_SUMMARY, `${table}\n`)
          '
          echo "lines=$(bun -p 'require("./coverage/coverage-summary.json").total.lines.pct')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # The bundle budget fails the job rather than warning, and the CSP is written
  # here too, so a policy that cannot be generated stops the run instead of
  # reaching a deploy.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run build
      - run: bun run size
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Three browsers, axe on every route in both colour schemes, the 375-pixel pass
  # and the keyboard walk. This is the slow one; it is still blocking, because it
  # is the only level that sees what a reader sees.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      # Keep this tag equal to the installed `@playwright/test`: the image's
      # browsers are the ones that version was built against. The digest pins
      # the tag to one image, as every action here is pinned to one commit;
      # bumping the tag means taking the new tag's digest with it.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      # Chromium's shared memory is otherwise the container's 64 MB default.
      options: --ipc=host
    env:
      # Any non-empty id will do: the OAuth flow is stubbed, and what this checks
      # is that the app is configured rather than showing its not-configured
      # screen. The real id is a Netlify environment variable, not a CI one.
      VITE_GITLAB_CLIENT_ID: acceptance-suite-client-id
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This image is where Node and the browsers come from, and Bun is the one
      # thing it lacks. `setup-bun` installs the version `packageManager` names,
      # like every other job, and unpacks it with `unzip`, which the image does
      # not carry either. It used to be `npm install --global bun@…`, which
      # Scorecard counts as an unpinned download: npm resolves it at run time.
      - name: Install unzip
        run: apt-get update && apt-get install --yes --no-install-recommends unzip
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The README's coverage badge, from `main` only. It runs when `test` failed
  # too, as long as coverage was measured: a figure that fell under the floor is
  # exactly the one the badge must not keep hiding behind the last good one.
  #
  # A manual run on `main` counts as much as a push does, here and in `release`
  # below. GitHub has dropped the push event of a merge outright — twice in one
  # afternoon, with its status page all green — and then nothing runs: no
  # checks, no release, no deploy. "Run workflow" on `main` is the recovery,
  # and it has to recover all of it.
  coverage-badge:
    needs: test
    if: ${{ !cancelled() && needs.test.outputs.lines != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/publish-badge
        with:
          name: coverage
          label: coverage
          value: ${{ needs.test.outputs.lines }}
          floor: 90

  # Every merge into `main` is a release (DELIVERY-3): the next version is
  # computed from the Conventional Commits since the last tag, and published as
  # a tag and a GitHub Release whose notes are those commits. Only after every
  # gate has passed on this commit, and only from `main`. `cliff.toml` holds the
  # rules; `CONTRIBUTING.md` says what a version means.
  #
  # One `gh release create` makes the tag and the release together, so a run
  # cancelled by a newer push cannot leave a tag with no release behind — and
  # the run that replaced it releases the same commits, and more.
  release:
    needs: [verify, test, build, e2e]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Pinned to a commit, not a tag: this is the one step that can write a
      # release, and a tag can be moved under it. The binary it downloads is
      # pinned too.
      - name: Compute the version and its notes
        id: cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          args: --unreleased --bump --strip header
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ runner.temp }}/release-notes.md
          VERSION: ${{ steps.cliff.outputs.version }}
        run: |
          if [ -z "$VERSION" ] || [ "$VERSION" = null ]; then
            echo "Nothing since the last tag is a release."
            exit 0
          fi
          if git rev-parse --quiet --verify "refs/tags/$VERSION" > /dev/null; then
            echo "$VERSION is already released."
            exit 0
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$NOTES"
          echo "Released [$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$VERSION)." >> "$GITHUB_STEP_SUMMARY"
