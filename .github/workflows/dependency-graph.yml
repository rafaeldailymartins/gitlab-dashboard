# Submits the dependencies `bun.lock` installs to GitHub's dependency graph,
# for `staging` and `main`.
#
# The graph reads `package.json` and not `bun.lock`, so without this it lists
# the packages this project names and none of what they bring in: Dependabot
# alerts miss every transitive advisory, and `dependency-review` in
# `pull-request.yml` has no tree to compare a pull request against.
# `scripts/dependency-snapshot.ts` has the details.

name: Dependency graph

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The snapshot submission is a write to the dependency graph.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Submit the dependencies bun.lock installs
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_REF: ${{ github.ref }}
          SNAPSHOT_SHA: ${{ github.sha }}
        run: |
          bun --bun scripts/dependency-snapshot.ts > "$RUNNER_TEMP/snapshot.json"
          gh api "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input "$RUNNER_TEMP/snapshot.json"
