# CodeQL over the code and the workflows, on every pull request whatever its
# base, on every push to `staging` and `main`, and weekly.
#
# This replaced GitHub's default setup, which analyses pull requests into the
# default branch only. Every change here goes into `staging` first, so the
# default setup saw promotions and nothing else: most commits reached `main`
# without an analysis of the pull request that brought them, which is what
# Scorecard's SAST check measures. The languages and the query suite (the
# default one, by naming none) are the ones the default setup used. The two
# cannot run side by side — an upload from this workflow is refused while the
# default setup is on — so it stays off in the repository's settings.
#
# The findings appear on the pull request and under Security → Code scanning,
# and do not block a merge: none of these jobs is a required check.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main, staging]
  schedule:
    # Wednesdays at 06:00 in São Paulo.
    - cron: '0 9 * * 3'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # To upload the results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
