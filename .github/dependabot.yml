# Weekly dependency updates, opened as pull requests into `staging` like any
# other change — `CONTRIBUTING.md` § Dependencies. They reach production with the
# next promotion.
#
# Version updates only. Dependabot cannot raise security updates for Bun, so a
# new advisory against a locked package is caught by the weekly `bun audit` in
# `audit.yml` instead; and a security update for an action would be raised
# against `main`, which `branch-policy` refuses from anything but `staging` or a
# hotfix. Both are covered by the weekly run below.
#
# The messages are Conventional Commits the `commit-messages` check accepts:
# `chore(deps): …`, `chore(deps-dev): …` and `ci(deps): …`. The group names are
# short because they end up in a header held to 72 characters.

version: 2

updates:
  - package-ecosystem: bun
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    commit-message:
      prefix: chore
      include: scope
    groups:
      runtime:
        dependency-type: production
      tooling:
        dependency-type: development
    open-pull-requests-limit: 5
    # Held back, each until something outside this repository moves. Every one
    # was proposed in the tooling group of 2026-10-09 and failed a gate there.
    # Delete an entry once its reason is gone, and Dependabot proposes the
    # version again.
    ignore:
      # typescript-eslint supports TypeScript below 6.1, and 7.x has no
      # JavaScript API for it to load at all: `bun run lint` fails before
      # reading a file.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # eslint-plugin-react 7.37.5, the newest there is, calls
      # `context.getFilename`, which ESLint 10 removed, and eslint-plugin-jsx-a11y
      # declares ESLint 9 at most. unicorn 66 onward requires ESLint 10.4.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: eslint-plugin-unicorn
        versions: ['>=66.0.0']
      # MSW 3 intercepts nothing under `bun --bun vitest`: every mocked request
      # goes to the network and the suite fails. The tests run on Bun by design
      # (`AGENTS.md` § Runtime).
      - dependency-name: msw
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
