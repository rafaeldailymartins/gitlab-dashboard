[build]
  # `commit.txt` names the commit this deploy was built from. It is how
  # `.github/workflows/deployments.yml` knows when a push has gone live, since
  # Netlify tells GitHub about deploy previews and nothing else. Only a Netlify
  # build sets `COMMIT_REF`, so it is written here rather than by `bun run build`.
  command = 'bun run build && printf "%s\n" "$COMMIT_REF" > dist/commit.txt'
  publish = "dist"

[build.environment]
  # Netlify picks Bun up from bun.lock; pinning the version keeps the CI build
  # and a local build on the same runtime.
  BUN_VERSION = "1.4.0"
  # The functions run on the Node the build uses, so this pins their runtime,
  # and `.github/actions/setup` installs the same major so CI tests on it.
  NODE_VERSION = "24"
  # Netlify runs `bun install` before the build command. Without these it would
  # resolve the lockfile again, and it would run the root `prepare` script,
  # which installs git hooks a build agent has no use for. CI installs with the
  # same two flags, for the same reason, in `.github/actions/setup/action.yml`.
  BUN_FLAGS = "--frozen-lockfile --ignore-scripts"

# The part of this app that does not run in the browser: two endpoints over one
# handler, holding the teams a reader defines and the working schedule they set.
# Both are on this origin so the bundle's own `connect-src 'self'` already
# reaches them, which is why `scripts/write-csp.ts` needs no second origin and
# why there is no CORS preflight to answer.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Single-page app. Without this every deep link — and `/auth/callback`, which the
# OAuth redirect lands on — would return 404 from the CDN instead of the app.
# Functions are matched before redirects, so `/.netlify/functions/*` is not
# swallowed by it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The Content-Security-Policy is not here. It names the hash of the inline
    # theme script, which is only known once the bundle exists, so `bun run csp`
    # writes it into `dist/_headers` after the build. Putting a policy here
    # instead would mean `script-src 'unsafe-inline'`, which permits exactly the
    # injection the policy is for.

# Hashed assets are immutable; index.html must never be cached, or a deploy
# would keep serving the previous bundle's asset references.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
